[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "golded-ftn-tools"
version = "1.1.0"
description = "FTN message bases, packets, nodelists and node operations from the command line"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "golded-ftn>=1.4.0,<2",
  "golded-ftn-msg>=1.4.0,<2",
  "golded-ftn-jam>=1.3.0,<2",
  "golded-ftn-squish>=1.3.0,<2",
  "golded-ftn-hudson>=1.3.0,<2",
  "golded-ftn-sqlite>=1.0.0,<2",
]

[project.urls]
Repository = "https://github.com/golded-dev/golded-ftn-tools-python"
Issues = "https://github.com/golded-dev/golded-ftn-tools-python/issues"
Changelog = "https://github.com/golded-dev/golded-ftn-tools-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
network = [
  "golded-ftn-packet>=1.0.0,<2",
  "golded-ftn-nodelist>=1.0.0,<2",
  "golded-ftn-binkp>=1.0.0,<2",
  "golded-ftn-tosser>=1.0.0,<2",
]

[project.scripts]
ftnt = "golded_ftn_tools.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "build>=1.2", "twine>=6", "hatchling>=1.26", "markdown>=3.7", "pygments>=2.19"]

[tool.hatch.build.targets.wheel]
packages = ["src/golded_ftn_tools"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "examples", "docs", "README.md", "LICENSE", "pyproject.toml", ".github"]
[tool.hatch.build.targets.sdist.hooks.custom]
path = "scripts/sdist_hook.py"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_reading_pages.py" = ["E501"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
